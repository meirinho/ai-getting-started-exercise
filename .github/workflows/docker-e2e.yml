name: Docker end-to-end

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start Ollama
        run: docker compose up -d --build ollama ollama-init

      - name: Wait for Ollama healthcheck and model pull
        run: |
          set -euo pipefail
          if docker compose wait --help >/dev/null 2>&1; then
            echo "using docker compose wait ollama-init"
            docker compose wait ollama-init
          else
            echo "docker compose wait unavailable; using loop"
            limit=90
            i=1
            while [ "$i" -le "$limit" ]; do
              state=$(docker compose ps -a --format '{{.State}}' ollama-init 2>/dev/null | tail -n 1 || true)
              echo "ollama-init state=${state:-unknown} ($i/$limit)"
              case "$state" in
                exited|stopped|dead) break ;;
              esac
              if [ "$i" -eq "$limit" ]; then
                echo "timeout waiting for ollama-init"
                docker compose ps -a
                exit 1
              fi
              i=$((i + 1))
              sleep 10
            done
          fi
          id=$(docker compose ps -aq ollama-init | tail -n 1)
          if [ -z "$id" ]; then
            echo "ollama-init container not found"
            docker compose ps -a
            exit 1
          fi
          code=$(docker inspect --format '{{.State.ExitCode}}' "$id")
          echo "ollama-init exit=$code"
          if [ "$code" != "0" ]; then
            echo "model pull failed"
            exit 1
          fi

      - name: Run the exercise with Ollama
        run: docker compose run --rm exercise python -m exercise run --llm ollama --check

      - name: Check output against the written criterion
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps exercise python -m exercise check | tee check-output.txt
          if ! grep -F "6 items checked, 6 ok, 0 failed." check-output.txt; then
            echo "Criterion check did not report 6 of 6."
            exit 1
          fi

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v