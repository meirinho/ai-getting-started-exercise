name: Docker end-to-end

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # qwen2.5:0.5b é o padrão do compose (máquina do aluno, mais leve),
    # mas um 0.5b costuma parafrasear datas e valores e não se abster com
    # o texto exato do critério. O critério não foi afrouxado; só o CI
    # usa um modelo um pouco maior, por EXERCICIO_LLM_MODELO.
    env:
      EXERCICIO_LLM_MODELO: qwen2.5:1.5b
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start Ollama
        run: docker compose up -d --build ollama ollama-init

      - name: Wait for Ollama healthcheck and model pull
        run: |
          set -euo pipefail
          if docker compose wait --help >/dev/null 2>&1; then
            echo "usando docker compose wait ollama-init"
            docker compose wait ollama-init
          else
            echo "docker compose wait indisponível; usando loop"
            limite=90
            i=1
            while [ "$i" -le "$limite" ]; do
              estado=$(docker compose ps -a --format '{{.State}}' ollama-init 2>/dev/null | tail -n 1 || true)
              echo "ollama-init estado=${estado:-desconhecido} ($i/$limite)"
              case "$estado" in
                exited|stopped|dead) break ;;
              esac
              if [ "$i" -eq "$limite" ]; then
                echo "timeout esperando o ollama-init"
                docker compose ps -a
                exit 1
              fi
              i=$((i + 1))
              sleep 10
            done
          fi
          id=$(docker compose ps -aq ollama-init | tail -n 1)
          if [ -z "$id" ]; then
            echo "não achei o container do ollama-init"
            docker compose ps -a
            exit 1
          fi
          codigo=$(docker inspect --format '{{.State.ExitCode}}' "$id")
          echo "ollama-init exit=$codigo"
          if [ "$codigo" != "0" ]; then
            echo "o pull do modelo falhou"
            exit 1
          fi

      - name: Run the exercise with Ollama
        run: docker compose run --rm exercicio python -m exercicio rodar --llm ollama --checar

      - name: Check output against the written criterion
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps exercicio python -m exercicio checar | tee checar-saida.txt
          if ! grep -F "6 itens conferidos, 6 ok, 0 falhou." checar-saida.txt; then
            echo "A conferência não deu 6 de 6."
            exit 1
          fi

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
