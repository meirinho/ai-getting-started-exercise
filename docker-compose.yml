# Docker path: start Ollama, pull a small model, run the exercise.
# The native Python path in the README still works without Docker.
#
# OpenRouter keys belong only in OPENROUTER_API_KEY (environment or local .env).
# Never commit secrets to this file or .env.example.

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      EXERCISE_LLM_MODEL: ${EXERCISE_LLM_MODEL:-qwen2.5:1.5b}
    entrypoint: ["ollama", "pull"]
    command: ["${EXERCISE_LLM_MODEL:-qwen2.5:1.5b}"]
    restart: "no"

  exercise:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434
      EXERCISE_LLM: ${EXERCISE_LLM:-ollama}
      EXERCISE_LLM_MODEL: ${EXERCISE_LLM_MODEL:-qwen2.5:1.5b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./output:/app/output
      - ./index:/app/index
    restart: "no"

volumes:
  ollama-models:
  hf-cache: